<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eeece5">
    <meta name="description" content="148 Noble Street, Greenpoint, Brooklyn.">
    <title>148 Noble Street</title>
    <link rel="icon" href="assets/logo/favicon.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="home-page">
    <header class="site-header">
      <a class="site-logo" href="index.html" aria-label="148 Noble Street home">
        <img src="assets/logo/148noblestreet-web.png" alt="" width="480" height="424">
      </a>
      <a class="header-action" href="mailto:info@148noblestreet.com?subject=Table%20request">Book a table</a>
    </header>

    <main class="home">
      <section class="home-panel">
        <h1 class="sr-only">148 Noble Street</h1>
        <nav class="home-nav" aria-label="Main navigation">
          <a href="info.html">Info</a>
          <a href="menus.html">Menus</a>
        </nav>
        <p class="home-hours">Thursday-Monday<br>5:00–11:00</p>
      </section>

      <picture class="home-photo">
        <source
          media="(max-width: 700px)"
          srcset="
            assets/photos/optimized/chef0-480.jpg 480w,
            assets/photos/optimized/chef0-960.jpg 960w,
            assets/photos/optimized/chef0-1600.jpg 1600w,
            assets/photos/optimized/chef0.jpg 3130w
          "
          sizes="100vw">
        <img
          src="assets/photos/optimized/main-placeholder.jpg"
          srcset="
            assets/photos/optimized/main-480.jpg 318w,
            assets/photos/optimized/main-960.jpg 636w,
            assets/photos/optimized/main-1600.jpg 1060w,
            assets/photos/optimized/main.jpg 2075w
          "
          sizes="(max-width: 700px) 100vw, 56vw"
          alt="Dinner at 148 Noble Street"
          width="2075"
          height="3130"
          fetchpriority="high">
      </picture>
    </main>

    <footer class="site-footer" aria-label="Contact information">
      <address>
        148 Noble Street<br>
        Brooklyn, NY 11222
      </address>
      <div>
        <a href="mailto:info@148noblestreet.com">info@148noblestreet.com</a><br>
        <span>+1 929 655 9008</span>
      </div>
      <div><a href="https://instagram.com/148noblestreet">Instagram</a></div>
    </footer>
  </body>
</html>
