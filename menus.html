<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eeece5">
    <meta name="description" content="Sample menus from 148 Noble Street in Greenpoint, Brooklyn.">
    <title>Menus — 148 Noble Street</title>
    <link rel="icon" href="assets/logo/favicon.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="index.html" aria-label="148 Noble Street home">
        <img
          src="assets/logo/148noblestreet-web.png"
          srcset="assets/logo/148noblestreet-web-240.png 240w, assets/logo/148noblestreet-web.png 480w"
          sizes="(max-width: 700px) 8.5rem, clamp(8.75rem, 11.7vw, 11.375rem)"
          alt=""
          width="480"
          height="345">
      </a>
      <a class="header-action" href="mailto:info@148noblestreet.com?subject=Table%20request">Book a table</a>
    </header>

    <main class="page">
      <nav class="page-nav" aria-label="Main navigation">
        <a href="info.html">Info</a>
        <a href="menus.html" aria-current="page">Menus</a>
      </nav>

      <div class="menus-layout">
        <div class="menus-meta">
          <p class="kicker">Sample menu</p>
          <a class="menus-enlarge" href="assets/menu/optimized/menu.jpg">View full size</a>
        </div>

        <img
          class="menus-photo"
          src="assets/menu/optimized/menu-480.jpg"
          srcset="
            assets/menu/optimized/menu-480.jpg 480w,
            assets/menu/optimized/menu-960.jpg 960w,
            assets/menu/optimized/menu.jpg 1500w
          "
          sizes="(max-width: 700px) calc(100vw - 2rem), min(55vw, 44rem)"
          alt="September 2026 sample menu"
          width="1500"
          height="2100"
          loading="lazy">
      </div>
    </main>

    <footer class="site-footer" aria-label="Contact information">
      <address>
        148 Noble Street<br>
        Brooklyn, NY 11222
      </address>
      <div>
        <a href="mailto:info@148noblestreet.com">info@148noblestreet.com</a><br>
        <span>+1 929 655 9008</span>
      </div>
      <div><a href="https://instagram.com/148noblestreet">Instagram</a></div>
    </footer>
  </body>
</html>
